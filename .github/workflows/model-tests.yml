name: Model tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: native
        run: npm install --no-audit --no-fund
      - name: Run model tests
        working-directory: native
        run: npm test
