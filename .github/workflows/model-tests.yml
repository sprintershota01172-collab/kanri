name: Model tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: native
        run: npm install --no-audit --no-fund
      - name: Run model tests
        working-directory: native
        run: npm test
      - name: Validate web syntax and Gantt grid
        run: node web/scripts/check-syntax.cjs
      - name: TypeScript check
        working-directory: native
        run: npm run check
      - name: Install Web UI test dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Verify animated task and Gantt reordering
        working-directory: web
        run: node scripts/test-reorder.cjs
      - name: Test folder UI and gestures
        working-directory: web
        run: npm run test:ui
      - name: Validate generated Excel workbook
        run: node web/scripts/test-export.cjs
      - name: Validate calendar picking and schedule display
        run: node web/scripts/test-calendar.cjs
      - name: Validate 20-row Gantt, vehicle folders and meetings
        run: node web/scripts/test-new-features.cjs
      - name: Validate iPhone full-screen PWA geometry
        run: node web/scripts/test-standalone.cjs
      - name: Install headless Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Verify iPhone navigation pixel geometry
        working-directory: web
        run: npm run test:layout
