name: Model tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run model tests
        run: node native/scripts/test-model.cjs
