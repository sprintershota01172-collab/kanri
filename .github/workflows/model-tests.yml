name: Model tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: native
        run: npm install --no-audit --no-fund
      - name: Run model tests
        working-directory: native
        run: npm test
      - name: Validate web syntax and Gantt grid
        run: node web/scripts/check-syntax.cjs
      - name: Validate generated Excel workbook
        run: node web/scripts/test-export.cjs
      - name: TypeScript check
        working-directory: native
        run: npm run check
      - name: Install Web UI test dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Test folder UI and gestures
        working-directory: web
        run: npm run test:ui
