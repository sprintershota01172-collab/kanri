/* iPhone: viewport-fit cover + fixed, non-scrolling app chrome */
html{height:100%;height:100dvh;overflow:hidden}
body{min-height:0;height:100%;height:100dvh;overflow:hidden;background:#101d32}
.device{min-height:0}
@media(max-width:499px){
  body{display:block;padding:0;margin:0;position:fixed;inset:0;width:100vw;height:100dvh}
  .device{position:fixed;inset:0;width:100vw;max-width:none;height:100dvh;max-height:none;margin:0;border:0;border-radius:0;box-shadow:none}
  .top{padding-top:max(12px,env(safe-area-inset-top,12px));padding-left:17px;padding-right:17px;padding-bottom:5px}
  .brand{font-size:27px}
  .hero{margin-top:9px;min-height:75px;padding:10px 14px;border-radius:19px}
  .main{padding:2px 13px 4px}
  .screen-head{min-height:38px}
  .board{gap:8px;padding-top:5px}
  .quadrant{padding:10px 8px 6px;border-radius:17px}
  .task-area{margin-top:5px}
  .board-foot{padding-top:5px}
  .nav{height:calc(64px + env(safe-area-inset-bottom,0px));min-height:64px;padding-bottom:env(safe-area-inset-bottom,0px);border-radius:20px 20px 0 0}
  .add-main{width:48px;height:48px}
}
/* day-by-day, full-month Gantt cells; horizontal space is evenly distributed */
.gantt{padding:11px 7px}
.gantt-month-head,.gantt-month-row{display:grid;grid-template-columns:76px minmax(0,1fr);column-gap:5px;align-items:center}
.gantt-month-head{padding-bottom:9px;border-bottom:1px solid var(--line)}
.gantt-day-head,.gantt-day-cells{display:grid;grid-template-columns:repeat(var(--days),minmax(0,1fr));gap:1px;min-width:0}
.gantt-day-head span{font-size:7px;text-align:center;color:var(--muted);font-weight:750;min-width:0}
.gantt-month-row{min-height:43px;border-bottom:1px solid var(--line)}
.gantt-title{font-size:10px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;padding:3px 1px}
.gantt-cell{display:block;width:100%;aspect-ratio:1 / 1;min-width:0;min-height:7px;border:1px solid var(--line);padding:0;border-radius:2px;background:var(--bg);touch-action:manipulation}
.gantt-cell.filled{border-color:transparent;background:var(--fill)}
.gantt-cell.due{outline:1px solid var(--red);outline-offset:-1px}
.gantt-cell.selected{box-shadow:0 0 0 1.5px var(--blue);z-index:2}
.gantt-legend{font-size:10px;color:var(--muted);line-height:1.5;margin-top:11px}
.gantt-controls{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-top:8px}
.gantt-controls button{font-size:10px;border-radius:9px;background:var(--tint);color:var(--blue);padding:7px 10px;font-weight:750}
.quadrant{cursor:pointer}
.quadrant:focus-visible,.gantt-cell:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.empty{pointer-events:none}
.quad-title strong{cursor:pointer}
@media(max-width:370px){.gantt-month-head,.gantt-month-row{grid-template-columns:65px minmax(0,1fr)}.gantt-title{font-size:9px}.gantt-cell{min-height:6px}.gantt{padding:9px 5px}}

.meta{font-size:10px}.empty{font-size:12px}.board-foot{padding-top:9px}

function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}function savePrefs(){localStorage.setItem(PREF,JSON.stringify(prefs))}function pad(n){return String(n).padStart(2,'0')}function dateKey(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}function parseLocal(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);if(!y||!m||!d)return null;const result=new Date(y,m-1,d);return dateKey(result)===s?result:null}function sameDay(a,b){return dateKey(a)===dateKey(b)}function diffDays(d){const a=parseLocal(d);if(!a)return 999;const now=new Date();return Math.round((a.getTime()-new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime())/86400000)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dayName(d){return `${d.getMonth()+1}/${d.getDate()}`}function dueLabel(d){if(!d)return '期限なし';let left=diffDays(d);return left<0?`${-left}日超過`:left===0?'今日まで':left===1?'明日まで':`${left}日後`}
function score(t){let d=diffDays(t.due);const U=d<0?1: d===999?0:1/(1+Math.max(0,d)/3);const P=((+t.important)+(+t.urgent))/2;const T=Math.min(t.duration,180)/180;return Math.round(45*U+35*P+20*T+(d<0?20:0))}function quadrant(t){if(prefs.mode==='group')return ['仕事','プライベート','学習','その他'].indexOf(t.group);return t.important?(t.urgent?0:1):(t.urgent?2:3)}function sorted(items){return [...items].sort((a,b)=>{if(a.pin!==b.pin)return a.pin?-1:1;if(a.pin&&b.pin)return (a.rank??999)-(b.rank??999);return score(b)-score(a)||new Date(a.created).getTime()-new Date(b.created).getTime()})}function isDone(t){return !!t.done}function mutate(id,patch){const t=tasks.find(t=>t.id===id);if(!t)return;Object.assign(t,patch);save();render()}function haptic(){try{navigator.vibrate?.(12)}catch{}}function flash(msg){clearTimeout(toastTimer);$('#toast').textContent=msg;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),1800)}function setUndo(label,fn){undoState=fn;$('#undoLabel').textContent=label;$('#undoBar').classList.add('show');clearTimeout(undoTimer);undoTimer=setTimeout(()=>{$('#undoBar').classList.remove('show');undoState=null},7000)}function undo(){if(!undoState){flash('戻せる操作はありません');return}let f=undoState;undoState=null;clearTimeout(undoTimer);$('#undoBar').classList.remove('show');f();flash('元に戻しました')}

function confirmAction(title,message,onConfirm){

function confirmTaskRemoval(id){
  const t=tasks.find(t=>t.id===id);if(!t)return;
  confirmAction('タスクを削除',t.title+' を削除しますか？',()=>{
    const previous={...t};tasks=tasks.filter(x=>x.id!==id);save();render();
    setUndo('削除しました',()=>{tasks.push(previous);save();render()});
  });
}
function confirmFolderRemoval(id){
  const folder=getFolder(id);if(!folder)return;
  const count=tasks.filter(t=>taskFolderId(t)===id).length;
  const children=folders.filter(f=>f.parentId===id).length;
  confirmAction('フォルダを削除',folder.name+' を削除しますか？ 中の'+count+'件のタスクと'+children+'個の子フォルダは1つ上へ移動します。',()=>{
    const parent=folder.parentId;
    tasks.forEach(t=>{if(taskFolderId(t)===id){t.folderId=parent;if(parent)t.group=rootCategory(parent)}});
    folders.forEach(f=>{if(f.parentId===id)f.parentId=parent});
    folders=folders.filter(f=>f.id!==id);
    save();saveFolders();
    if(currentFolderId===id)currentFolderId=parent;
    saveView();render();
  });
}

function wireFolderSwipe(el){
  let startX=0,startY=0,swiping=false;
  el.addEventListener('pointerdown',e=>{if(e.button!==0)return;startX=e.clientX;startY=e.clientY;swiping=false;el.setPointerCapture(e.pointerId)});
  el.addEventListener('pointermove',e=>{
    if(!el.hasPointerCapture(e.pointerId))return;
    const dx=e.clientX-startX,dy=e.clientY-startY;
    if(Math.abs(dy)>30)return;
    if(dx< -14){swiping=true;el.style.transform='translateX('+Math.max(-58,dx)+'px)'}
  });
  el.addEventListener('pointerup',e=>{
    const dx=e.clientX-startX;
    if(swiping){el.dataset.swiped='1';const opened=dx< -38;closeSwipeItems(el.parentElement);el.parentElement.classList.toggle('revealed',opened);el.style.transform=opened?'translateX(-58px)':''}
  });
  el.addEventListener('pointercancel',()=>{if(!el.parentElement.classList.contains('revealed'))el.style.transform=''});
}

  let html='<div class="folder-path"><button class="folder-crumb '+(!current?'current':'')+'" data-folder-root="1">⌂ すべて</button>';
  for(const f of path)html+='<span class="folder-sep">›</span><button class="folder-crumb '+(currentFolderId===f.id?'current':'')+'" data-folder-path="'+esc(f.id)+'">'+esc(f.name)+'</button>';
  html+='<button class="folder-create" id="folderAdd" aria-label="フォルダを追加">＋</button></div>';
  if(children.length)html+='<div class="folder-strip">'+children.map(f=>
    '<div class="folder-wrap"><button class="folder-trash" data-folder-trash="'+esc(f.id)+'" aria-label="'+esc(f.name)+'を削除">削除</button>'+
    '<button class="folder-tile" data-folder-open="'+esc(f.id)+'"><span class="folder-icon">▰</span><span>'+esc(f.name)+'</span></button></div>'
  ).join('')+'</div>';
  $('#folderBrowser').innerHTML=html;
  $('[data-folder-root]').onclick=()=>setFolder(null);
  $$('[data-folder-path]').forEach(el=>el.onclick=()=>setFolder(el.dataset.folderPath));
  $('#folderAdd').onclick=createFolderSheet;
  $$('[data-folder-open]').forEach(el=>{wireFolderSwipe(el);el.onclick=()=>{if(el.dataset.swiped){el.dataset.swiped='';return}setFolder(el.dataset.folderOpen)}});
  $$('[data-folder-trash]').forEach(el=>el.onclick=e=>{e.stopPropagation();confirmFolderRemoval(el.dataset.folderTrash)});
}

function renderBoard(){renderFolders();$('#boardScreen .board-foot').hidden=!tasks.some(t=>t.pin);let html='';for(let q=0;q<4;q++){const items=sorted(tasks.filter(t=>!t.done&&quadrant(t)===q&&(currentFolderId===null||taskFolderId(t)===currentFolderId)));const pageSize=window.innerHeight>=820?4:window.innerHeight>=690?3:2;const pages=Math.max(1,Math.ceil(items.length/pageSize));qpages[q]=Math.min(qpages[q],pages-1);let showing=items.slice(qpages[q]*pageSize,qpages[q]*pageSize+pageSize);html+=`<section class="quadrant" data-q="${q}" role="button" tabindex="0" aria-label="${esc(prefs.names[q])} にタスクを追加"><div class="quad-title"><strong>${esc(prefs.names[q])}</strong><span>${items.length.toString().padStart(2,'0')}</span></div><div class="accent" style="background:${palette[q]}"></div><div class="task-area">${showing.length?showing.map(t=>`<div class="task-wrap"><button type="button" class="task-swipe-delete" data-task-trash="${t.id}" aria-label="${esc(t.title)}を削除">削除</button><article class="task-card" data-task="${t.id}"><div class="task-line"><button aria-label="完了" class="check" data-done="${t.id}"></button><div class="tname">${esc(t.title)}</div><button class="tiny-pin" data-top="${t.id}" aria-label="最上位に固定">${t.pin?'◆':'◇'}</button></div><div class="meta">${esc(dueLabel(t.due))} · ${t.duration}分 · ${score(t)}pt</div></article></div>`).join(''):'<div class="empty"><span aria-hidden="true">＋</span></div>'}</div><div class="pager"><button data-page="${q}" data-dir="-1" ${qpages[q]<=0?'disabled':''}>‹</button><span>${qpages[q]+1}/${pages}</span><button data-page="${q}" data-dir="1" ${qpages[q]>=pages-1?'disabled':''}>›</button></div></section>`}$('#board').innerHTML=html;$$('[data-page]').forEach(el=>el.onclick=()=>{qpages[+el.dataset.page]+=+el.dataset.dir;renderBoard()});$$('.quadrant').forEach(el=>{el.onclick=e=>{if(e.target.closest('button,.task-card'))return;openEdit(null,+el.dataset.q)};el.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target===el){e.preventDefault();openEdit(null,+el.dataset.q)}}});$$('.task-card').forEach(setupDrag);$$('[data-task-trash]').forEach(el=>el.onclick=e=>{e.stopPropagation();confirmTaskRemoval(el.dataset.taskTrash)});$$('[data-done]').forEach(el=>el.addEventListener('pointerdown',e=>e.stopPropagation()));$$('[data-top]').forEach(el=>el.addEventListener('pointerdown',e=>e.stopPropagation()));$$('[data-top]').forEach(el=>el.onclick=e=>{e.stopPropagation();const t=tasks.find(t=>t.id===el.dataset.top);if(!t)return;let pinned=tasks.filter(x=>x.pin);t.pin=true;t.rank=Math.min(0,...pinned.map(x=>x.rank??0))-1;save();render();flash('最上位に固定しました')});$$('[data-done]').forEach(el=>el.onclick=e=>{e.stopPropagation();const t=tasks.find(t=>t.id===el.dataset.done);if(!t)return;mutate(t.id,{done:true});haptic();setUndo('タスクを完了しました',()=>mutate(t.id,{done:false}))})}
function moveQuadrant(t,q){if(prefs.mode==='group'){t.group=['仕事','プライベート','学習','その他'][q];t.folderId=['work','personal','study','other'][q]}else{t.important=q<=1;t.urgent=q===0||q===2}t.pin=false;t.rank=null;save();render();haptic();flash('エリアを移動しました')}
function setupDrag(el){
  let sx=0,sy=0,dragged=false,swiping=false,timer=null,armed=false;
  const wrap=el.closest('.task-wrap');
  el.onpointerdown=e=>{
    if(e.target.closest('button'))return;
    sx=e.clientX;sy=e.clientY;dragged=false;swiping=false;armed=false;
    timer=setTimeout(()=>{if(!swiping){armed=true;haptic()}},210);
    el.setPointerCapture(e.pointerId);
  };
  el.onpointermove=e=>{
    if(!el.hasPointerCapture(e.pointerId))return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!armed&&Math.abs(dy)<32&&dx < -18){
      clearTimeout(timer);swiping=true;
      el.style.transform='translateX('+Math.max(-64,dx)+'px)';
      return;
    }
    if(swiping){el.style.transform='translateX('+Math.max(-64,Math.min(0,dx))+'px)';return}
    if(Math.abs(dx)+Math.abs(dy)>9){
      if(!armed){if(Math.abs(dy)>14)clearTimeout(timer);return}
      dragged=true;el.classList.add('dragging');
      el.style.transform='translate('+dx+'px,'+dy+'px) scale(1.03)';
      $$('.quadrant').forEach(q=>{const r=q.getBoundingClientRect();q.classList.toggle('over',e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)});
    }
  };
  el.onpointerup=e=>{
    clearTimeout(timer);el.classList.remove('dragging');$$('.quadrant').forEach(q=>q.classList.remove('over'));
    if(swiping){
      const reveal=e.clientX-sx < -42;
      closeSwipeItems(wrap);
      wrap.classList.toggle('revealed',reveal);
      el.style.transform=reveal?'translateX(-64px)':'';
      return;
    }
    el.style.transform='';
    if(dragged){
      const target=$$('.quadrant').find(q=>{const r=q.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom});
      const task=tasks.find(t=>t.id===el.dataset.task);
      if(task&&target){
        const old={important:task.important,urgent:task.urgent,group:task.group,pin:task.pin,rank:task.rank,folderId:task.folderId};
        if(quadrant(task)===+target.dataset.q){task.pin=true;task.rank=Math.min(0,...tasks.filter(x=>x.pin).map(x=>x.rank??0))-1;save();render();flash('最上位に固定しました')}
        else moveQuadrant(task,+target.dataset.q);
        setUndo('エリアを移動しました',()=>mutate(task.id,old));
      }
      return;
    }
    if(wrap.classList.contains('revealed')){closeSwipeItems();return}
    openEdit(el.dataset.task);
  };
  el.onpointercancel=()=>{clearTimeout(timer);el.classList.remove('dragging');if(!wrap.classList.contains('revealed'))el.style.transform=''};
}

function renderCalendar(){let base=focusDay;let nav=`<div class="date-nav"><button id="prevDate">‹</button><strong>${calMode==='month'?`${base.getFullYear()}年 ${base.getMonth()+1}月`:calMode==='week'?`${dayName(startWeek(base))} – ${dayName(addDays(startWeek(base),6))}`:`${base.getFullYear()}年 ${base.getMonth()+1}月`}</strong><button id="nextDate">›</button></div>`;let html=nav;if(calMode==='month'){let first=new Date(base.getFullYear(),base.getMonth(),1),start=addDays(first,-first.getDay());html+='<div class="month-box"><div class="week-labels">'+[...'日月火水木金土'].map(x=>`<div>${x}</div>`).join('')+'</div><div class="month-grid">';for(let i=0;i<42;i++){let d=addDays(start,i),k=dateKey(d),dayTasks=tasks.filter(t=>!t.done&&(t.due===k||t.scheduled?.slice(0,10)===k));html+=`<button class="day ${d.getMonth()!==base.getMonth()?'outside':''} ${sameDay(d,base)?'sel':''} ${sameDay(d,new Date())?'today':''}" data-caldate="${k}">${d.getDate()}<div class="day-dots">${dayTasks.slice(0,3).map(()=>'<i class="dot"></i>').join('')}</div></button>`}html+='</div></div>'+agendaHtml(base)}else if(calMode==='week'){let start=startWeek(base);html+='<div class="week-cards">';for(let i=0;i<7;i++){let d=addDays(start,i),k=dateKey(d);let n=tasks.filter(t=>t.due===k||t.scheduled?.slice(0,10)===k).length;html+=`<button class="week-day ${sameDay(d,base)?'active':''}" data-caldate="${k}"><span>${'日月火水木金土'[d.getDay()]}</span><b>${d.getDate()}</b><em>${n}件</em></button>`}html+='</div>'+agendaHtml(base)}else{

    </div>
