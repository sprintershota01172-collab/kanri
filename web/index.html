/* iPhone: viewport-fit cover + fixed, non-scrolling app chrome */
html{height:100%;height:100dvh;overflow:hidden}
body{min-height:0;height:100%;height:100dvh;overflow:hidden;background:#101d32}
.device{min-height:0}
@media(max-width:499px){
  body{display:block;padding:0;margin:0;position:fixed;inset:0;width:100vw;height:100dvh}
  .device{position:fixed;inset:0;width:100vw;max-width:none;height:100dvh;max-height:none;margin:0;border:0;border-radius:0;box-shadow:none}
  .top{padding-top:max(12px,env(safe-area-inset-top,12px));padding-left:17px;padding-right:17px;padding-bottom:5px}
  .brand{font-size:27px}
  .hero{margin-top:9px;min-height:75px;padding:10px 14px;border-radius:19px}
  .main{padding:2px 13px 4px}
  .screen-head{min-height:38px}
  .board{gap:8px;padding-top:5px}
  .quadrant{padding:10px 8px 6px;border-radius:17px}
  .task-area{margin-top:5px}
  .board-foot{padding-top:5px}
  .nav{height:calc(64px + env(safe-area-inset-bottom,0px));min-height:64px;padding-bottom:env(safe-area-inset-bottom,0px);border-radius:20px 20px 0 0}
  .add-main{width:48px;height:48px}
}
/* day-by-day, full-month Gantt cells; horizontal space is evenly distributed */
.gantt{padding:11px 7px}
.gantt-month-head,.gantt-month-row{display:grid;grid-template-columns:76px minmax(0,1fr);column-gap:5px;align-items:center}
.gantt-month-head{padding-bottom:9px;border-bottom:1px solid var(--line)}
.gantt-day-head,.gantt-day-cells{display:grid;grid-template-columns:repeat(var(--days),minmax(0,1fr));gap:1px;min-width:0}
.gantt-day-head span{font-size:7px;text-align:center;color:var(--muted);font-weight:750;min-width:0}
.gantt-month-row{min-height:43px;border-bottom:1px solid var(--line)}
.gantt-title{font-size:10px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;padding:3px 1px}
.gantt-cell{display:block;width:100%;aspect-ratio:1 / 1;min-width:0;min-height:7px;border:1px solid var(--line);padding:0;border-radius:2px;background:var(--bg);touch-action:manipulation}
.gantt-cell.filled{border-color:transparent;background:var(--fill)}
.gantt-cell.due{outline:1px solid var(--red);outline-offset:-1px}
.gantt-cell.selected{box-shadow:0 0 0 1.5px var(--blue);z-index:2}
.gantt-legend{font-size:10px;color:var(--muted);line-height:1.5;margin-top:11px}
.gantt-controls{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-top:8px}
.gantt-controls button{font-size:10px;border-radius:9px;background:var(--tint);color:var(--blue);padding:7px 10px;font-weight:750}
.quadrant{cursor:pointer}
.quadrant:focus-visible,.gantt-cell:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.empty{pointer-events:none}
.quad-title strong{cursor:pointer}
@media(max-width:370px){.gantt-month-head,.gantt-month-row{grid-template-columns:65px minmax(0,1fr)}.gantt-title{font-size:9px}.gantt-cell{min-height:6px}.gantt{padding:9px 5px}}

<script>
(()=>{'use strict';
const KEY='kanri_v1_tasks',PREF='kanri_v1_prefs';const defaults={mode:'priority',names:['重要・緊急','重要・余裕あり','緊急・軽め','あとで考える'],dark:false,notify:true,lead:60};let prefs={...defaults,...read(PREF,{})};let tasks=read(KEY,[]);if(!Array.isArray(tasks))tasks=[];let tab='board',calMode='month',focusDay=new Date(),puzzleDay=new Date(),qpages=[0,0,0,0],ganttPage=0,inboxPage=0,activePuzzle=null,undoState=null,undoTimer=null,toastTimer=null,sortingManual=false;const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];const palette=['#c78086','#6381bd','#c7aa74','#719a91'];
function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}function savePrefs(){localStorage.setItem(PREF,JSON.stringify(prefs))}function pad(n){return String(n).padStart(2,'0')}function dateKey(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}function parseLocal(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);if(!y||!m||!d)return null;const result=new Date(y,m-1,d);return dateKey(result)===s?result:null}function sameDay(a,b){return dateKey(a)===dateKey(b)}function diffDays(d){const a=parseLocal(d);if(!a)return 999;const now=new Date();return Math.round((a.getTime()-new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime())/86400000)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dayName(d){return `${d.getMonth()+1}/${d.getDate()}`}function dueLabel(d){if(!d)return '期限なし';let left=diffDays(d);return left<0?`${-left}日超過`:left===0?'今日まで':left===1?'明日まで':`${left}日後`}
function score(t){let d=diffDays(t.due);const U=d<0?1: d===999?0:1/(1+Math.max(0,d)/3);const P=((+t.important)+(+t.urgent))/2;const T=Math.min(t.duration,180)/180;return Math.round(45*U+35*P+20*T+(d<0?20:0))}function quadrant(t){if(prefs.mode==='group')return ['仕事','プライベート','学習','その他'].indexOf(t.group);return t.important?(t.urgent?0:1):(t.urgent?2:3)}function sorted(items){return [...items].sort((a,b)=>{if(a.pin!==b.pin)return a.pin?-1:1;if(a.pin&&b.pin)return (a.rank??999)-(b.rank??999);return score(b)-score(a)||new Date(a.created).getTime()-new Date(b.created).getTime()})}function isDone(t){return !!t.done}function mutate(id,patch){const t=tasks.find(t=>t.id===id);if(!t)return;Object.assign(t,patch);save();render()}function haptic(){try{navigator.vibrate?.(12)}catch{}}function flash(msg){clearTimeout(toastTimer);$('#toast').textContent=msg;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),1800)}function setUndo(label,fn){undoState=fn;$('#undoLabel').textContent=label;$('#undoBar').classList.add('show');clearTimeout(undoTimer);undoTimer=setTimeout(()=>{$('#undoBar').classList.remove('show');undoState=null},7000)}function undo(){if(!undoState){flash('戻せる操作はありません');return}let f=undoState;undoState=null;clearTimeout(undoTimer);$('#undoBar').classList.remove('show');f();flash('元に戻しました')}
function render(){document.getElementById('app').classList.toggle('dark',prefs.dark);let all=tasks.length,done=tasks.filter(isDone).length,pct=all?Math.round(done/all*100):0;$('#meter').style.setProperty('--progress',pct+'%');$('#meterText').textContent=pct+'%';$('#heroMain').textContent=all===0?'まずは、ひとつ登録。':done===all?'今日も、整いました。':`${all-done}個、整えていこう。`;let top=sorted(tasks.filter(t=>!t.done))[0];$('#heroSub').textContent=top?`次の優先事項：${top.title}`:'＋からタスクを追加できます';let n=new Date();$('#todayText').textContent=`${n.getMonth()+1}月${n.getDate()}日 ${'日月火水木金土'[n.getDay()]}曜日`; $$('.nav-btn[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$$('.screen').forEach(el=>el.classList.toggle('active',el.id===tab+'Screen'));if(tab==='board')renderBoard();if(tab==='calendar')renderCalendar();if(tab==='puzzle')renderPuzzle();if(tab==='settings')renderSettings()}
function renderBoard(){let html='';for(let q=0;q<4;q++){const items=sorted(tasks.filter(t=>!t.done&&quadrant(t)===q));const pageSize=window.innerHeight<720?1:2;const pages=Math.max(1,Math.ceil(items.length/pageSize));qpages[q]=Math.min(qpages[q],pages-1);let showing=items.slice(qpages[q]*pageSize,qpages[q]*pageSize+pageSize);html+=`<section class="quadrant" data-q="${q}" role="button" tabindex="0" aria-label="${esc(prefs.names[q])} にタスクを追加"><div class="quad-title"><strong>${esc(prefs.names[q])}</strong><span>${items.length.toString().padStart(2,'0')}</span></div><div class="accent" style="background:${palette[q]}"></div><div class="task-area">${showing.length?showing.map(t=>`<article class="task-card" data-task="${t.id}"><div class="task-line"><button aria-label="完了" class="check" data-done="${t.id}"></button><div class="tname">${esc(t.title)}</div><button class="tiny-pin" data-top="${t.id}" aria-label="最上位に固定">${t.pin?'◆':'◇'}</button></div><div class="meta">${esc(dueLabel(t.due))} · ${t.duration}分 · ${score(t)}pt</div></article>`).join(''):'<div class="empty">＋ タップして追加<br>長押しで移動</div>'}</div><div class="pager"><button data-page="${q}" data-dir="-1" ${qpages[q]<=0?'disabled':''}>‹</button><span>${qpages[q]+1}/${pages}</span><button data-page="${q}" data-dir="1" ${qpages[q]>=pages-1?'disabled':''}>›</button></div></section>`}$('#board').innerHTML=html;$$('[data-page]').forEach(el=>el.onclick=()=>{qpages[+el.dataset.page]+=+el.dataset.dir;renderBoard()});$$('.quadrant').forEach(el=>{el.onclick=e=>{if(e.target.closest('button,.task-card'))return;openEdit(null,+el.dataset.q)};el.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target===el){e.preventDefault();openEdit(null,+el.dataset.q)}}});$$('.task-card').forEach(setupDrag);$$('[data-done]').forEach(el=>el.addEventListener('pointerdown',e=>e.stopPropagation()));$$('[data-top]').forEach(el=>el.addEventListener('pointerdown',e=>e.stopPropagation()));$$('[data-top]').forEach(el=>el.onclick=e=>{e.stopPropagation();const t=tasks.find(t=>t.id===el.dataset.top);if(!t)return;let pinned=tasks.filter(x=>x.pin);t.pin=true;t.rank=Math.min(0,...pinned.map(x=>x.rank??0))-1;save();render();flash('最上位に固定しました')});$$('[data-done]').forEach(el=>el.onclick=e=>{e.stopPropagation();const t=tasks.find(t=>t.id===el.dataset.done);if(!t)return;mutate(t.id,{done:true});haptic();setUndo('タスクを完了しました',()=>mutate(t.id,{done:false}))})}
function moveQuadrant(t,q){if(prefs.mode==='group'){t.group=['仕事','プライベート','学習','その他'][q]}else{t.important=q<=1;t.urgent=q===0||q===2}t.pin=false;t.rank=null;save();render();haptic();flash('エリアを移動しました')}
function setupDrag(el){let sx=0,sy=0,dragged=false,timer=null,armed=false;el.onpointerdown=e=>{if(e.target.closest('button'))return;sx=e.clientX;sy=e.clientY;dragged=false;armed=false;timer=setTimeout(()=>{armed=true;haptic()},170);el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!el.hasPointerCapture(e.pointerId))return;let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>9){clearTimeout(timer);if(!armed)return;dragged=true;el.classList.add('dragging');el.style.transform=`translate(${dx}px,${dy}px) scale(1.03)`;$$('.quadrant').forEach(q=>{const r=q.getBoundingClientRect();q.classList.toggle('over',e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)})}};el.onpointerup=e=>{clearTimeout(timer);el.classList.remove('dragging');el.style.transform='';$$('.quadrant').forEach(x=>x.classList.remove('over'));if(dragged){let target=$$('.quadrant').find(q=>{const r=q.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom});let task=tasks.find(t=>t.id===el.dataset.task);if(task&&target){let old={important:task.important,urgent:task.urgent,group:task.group,pin:task.pin,rank:task.rank};if(quadrant(task)===+target.dataset.q){task.pin=true;task.rank=Math.min(0,...tasks.filter(x=>x.pin).map(x=>x.rank??0))-1;save();render();flash('最上位に固定しました')}else moveQuadrant(task,+target.dataset.q);setUndo('エリアを移動しました',()=>mutate(task.id,old))}}else openEdit(el.dataset.task)};el.onpointercancel=()=>{clearTimeout(timer);el.style.transform=''}}
function changeDay(d,forPuzzle=false){if(forPuzzle)puzzleDay=d;else focusDay=d;render()}
function renderCalendar(){let base=focusDay;let nav=`<div class="date-nav"><button id="prevDate">‹</button><strong>${calMode==='month'?`${base.getFullYear()}年 ${base.getMonth()+1}月`:calMode==='week'?`${dayName(startWeek(base))} – ${dayName(addDays(startWeek(base),6))}`:`${base.getFullYear()}年 ${base.getMonth()+1}月`}</strong><button id="nextDate">›</button></div>`;let html=nav;if(calMode==='month'){let first=new Date(base.getFullYear(),base.getMonth(),1),start=addDays(first,-first.getDay());html+='<div class="month-box"><div class="week-labels">'+[...'日月火水木金土'].map(x=>`<div>${x}</div>`).join('')+'</div><div class="month-grid">';for(let i=0;i<42;i++){let d=addDays(start,i),k=dateKey(d),dayTasks=tasks.filter(t=>!t.done&&(t.due===k||t.scheduled?.slice(0,10)===k));html+=`<button class="day ${d.getMonth()!==base.getMonth()?'outside':''} ${sameDay(d,base)?'sel':''} ${sameDay(d,new Date())?'today':''}" data-caldate="${k}">${d.getDate()}<div class="day-dots">${dayTasks.slice(0,3).map(()=>'<i class="dot"></i>').join('')}</div></button>`}html+='</div></div>'+agendaHtml(base)}else if(calMode==='week'){let start=startWeek(base);html+='<div class="week-cards">';for(let i=0;i<7;i++){let d=addDays(start,i),k=dateKey(d);let n=tasks.filter(t=>t.due===k||t.scheduled?.slice(0,10)===k).length;html+=`<button class="week-day ${sameDay(d,base)?'active':''}" data-caldate="${k}"><span>${'日月火水木金土'[d.getDay()]}</span><b>${d.getDate()}</b><em>${n}件</em></button>`}html+='</div>'+agendaHtml(base)}else{const first=new Date(base.getFullYear(),base.getMonth(),1),days=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
const list=sorted(tasks.filter(t=>!t.done));const view=list.slice(ganttPage*7,ganttPage*7+7);const maxPages=Math.max(1,Math.ceil(list.length/7));
html+=`<div class="gantt" style="--days:${days}"><div class="gantt-month-head"><span class="gantt-title" style="color:var(--muted)">TASK / LT</span><div class="gantt-day-head">${Array.from({length:days},(_,i)=>`<span>${i===0||(i+1)%5===0||i===days-1?i+1:''}</span>`).join('')}</div></div>`;
for(const t of view){const startDate=parseLocal(t.ganttStart||t.scheduled?.slice(0,10)||t.due);const lt=Math.max(1,Math.min(90,Number(t.leadDays)||1));
html+=`<div class="gantt-month-row"><button class="gantt-title" data-edit="${t.id}" title="${esc(t.title)}">${esc(t.title)}<span style="display:block;color:var(--muted);font-size:8px">LT ${lt}日</span></button><div class="gantt-day-cells">`;
for(let i=0;i<days;i++){const day=new Date(base.getFullYear(),base.getMonth(),i+1),k=dateKey(day),delta=startDate?Math.round((day-startDate)/86400000):-999;const selected=!!t.ganttStart&&t.ganttStart===k;const filled=delta>=0&&delta<lt;
html+=`<button class="gantt-cell ${filled?'filled':''} ${t.due===k?'due':''} ${selected?'selected':''}" style="--fill:${palette[quadrant(t)]}" data-gantt="${t.id}" data-day="${k}" title="${esc(t.title)} / ${k} / LT ${lt}日" aria-label="${esc(t.title)} ${k} を開始日に指定"></button>`;
}html+='</div></div>'}
html+=`<div class="gantt-controls"><span class="sub">${list.length}タスク · ${days}日表示</span><div class="pager"><button id="gprev">‹</button><span>${ganttPage+1}/${maxPages}</span><button id="gnext">›</button></div></div><div class="gantt-legend">■ 色つき＝LT（開始日からの日数）　枠線＝納期<br>マスをタップして開始日を変更。LTはタスク編集で設定。</div></div>`
}$('#calendarContent').innerHTML=html;$('#prevDate').onclick=()=>changeDay(calMode!=='week'?new Date(base.getFullYear(),base.getMonth()-1,Math.min(base.getDate(),28)):addDays(base,-7));$('#nextDate').onclick=()=>changeDay(calMode!=='week'?new Date(base.getFullYear(),base.getMonth()+1,Math.min(base.getDate(),28)):addDays(base,7));$$('[data-caldate]').forEach(el=>el.onclick=()=>changeDay(parseLocal(el.dataset.caldate)));$$('[data-edit]').forEach(el=>el.onclick=()=>openEdit(el.dataset.edit));$$('[data-gantt]').forEach(el=>el.onclick=()=>{const t=tasks.find(x=>x.id===el.dataset.gantt);if(!t)return;const before=t.ganttStart||null;t.ganttStart=el.dataset.day;save();renderCalendar();haptic();setUndo('ガント開始日を設定しました',()=>{t.ganttStart=before;save();renderCalendar()})});$('#gprev')?.addEventListener('click',()=>{ganttPage=Math.max(0,ganttPage-1);renderCalendar()});$('#gnext')?.addEventListener('click',()=>{ganttPage=Math.min(Math.max(0,Math.ceil(tasks.filter(t=>!t.done).length/7)-1),ganttPage+1);renderCalendar()})}
function agendaHtml(day){const k=dateKey(day),items=sorted(tasks.filter(t=>!t.done&&(t.due===k||t.scheduled?.slice(0,10)===k))).slice(0,3);return `<div class="agenda"><div class="agenda-head"><strong style="font-size:12px">${dayName(day)} の予定</strong><span class="sub">${items.length}件を表示</span></div><div class="agenda-list">${items.length?items.map(t=>`<button class="agenda-task" data-edit="${t.id}"><div class="line" style="background:${palette[quadrant(t)]}"></div><div style="text-align:left;flex:1;min-width:0"><strong style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.title)}</strong><span>${t.scheduled?`${t.scheduled.slice(11,16)} 開始`:'未配置'} · ${t.duration}分 · ${dueLabel(t.due)}</span></div><span style="font-size:12px">›</span></button>`).join(''):'<div class="empty">まだ予定はありません。<br>パズルで時間を配置しましょう。</div>'}</div></div>`}
function startWeek(d){return addDays(d,-d.getDay())}function addDays(d,n){let r=new Date(d);r.setDate(r.getDate()+n);return r}
function slotMinute(col,row){return (col===0?8:14)*60+row*30}function hhmm(m){return `${pad(Math.floor(m/60))}:${pad(m%60)}`}function isConflict(start,end,omit){return tasks.some(t=>t.id!==omit&&!t.done&&t.scheduled?.slice(0,10)===dateKey(puzzleDay)&&(()=>{let x=+t.scheduled.slice(11,13)*60+(+t.scheduled.slice(14,16));return start<x+t.duration&&end>x})())}function trySchedule(id,minutes){let task=tasks.find(t=>t.id===id);if(!task)return;const dur=task.duration;const day=dateKey(puzzleDay);if(minutes+dur>(minutes<14*60?14*60:20*60)){flash('ブロックがこの時間枠に収まりません');return}if(isConflict(minutes,minutes+dur,id)){flash('ほかの予定と重なっています');return}let old=task.scheduled;task.scheduled=`${day}T${hhmm(minutes)}`;activePuzzle=null;save();render();haptic();flash('カチッ。予定を配置しました');setUndo('予定を配置しました',()=>mutate(id,{scheduled:old}))}
function renderPuzzle(){const k=dateKey(puzzleDay),unscheduled=sorted(tasks.filter(t=>!t.done&&!t.scheduled)),pages=Math.max(1,Math.ceil(unscheduled.length/2));inboxPage=Math.min(inboxPage,pages-1);let view=unscheduled.slice(inboxPage*2,inboxPage*2+2);let html=`<div class="puzzle-top"><div class="puzzle-tophead">UNPLACED TASKS <span>${unscheduled.length} 待機中</span></div><div class="inbox">${view.length?view.map(t=>`<button class="puzzle-chip ${activePuzzle===t.id?'active':''}" data-puzzle="${t.id}"><strong>${esc(t.title)}</strong><span>${t.duration}分 · ${dueLabel(t.due)}</span></button>`).join(''):'<div style="color:#aab8d0;font-size:11px;padding:8px">すべて予定に配置済みです</div>'}</div><div class="pager"><button id="iprev">‹</button><span>${inboxPage+1}/${pages}</span><button id="inext">›</button></div></div><div class="puzzle-day"><button class="link" id="puzprev">‹ 前日</button><strong style="font-size:12px">${puzzleDay.getMonth()+1}月${puzzleDay.getDate()}日 ${'日月火水木金土'[puzzleDay.getDay()]}曜日</strong><button class="link" id="puznext">翌日 ›</button></div><div class="time-grid">`;for(let col=0;col<2;col++){html+=`<div class="time-panel" data-col="${col}">`;for(let row=0;row<12;row++){let minute=slotMinute(col,row);html+=`<button class="time-slot" data-min="${minute}"><span class="time-label">${hhmm(minute)}</span></button>`}for(let t of tasks.filter(t=>!t.done&&t.scheduled?.slice(0,10)===k)){let m=(+t.scheduled.slice(11,13))*60+(+t.scheduled.slice(14,16));const c=m<14*60?0:1;if(c!==col)continue;let offset=(m-(c===0?8:14)*60)/360,hi=t.duration/360;html+=`<button class="scheduled-chip" data-remove="${t.id}" style="top:calc(8px + (100% - 14px) * ${offset});height:calc((100% - 14px) * ${Math.min(hi,1-offset)});background:${palette[quadrant(t)]}"><strong>${esc(t.title)}</strong><small>${hhmm(m)}–${hhmm(m+t.duration)}</small></button>`}html+='</div>'}html+=`</div><div class="puzzle-foot"><span class="hint">タスクを選択→枠をタップ、またはドラッグ</span><button class="link" id="clearDay">予定を外す</button></d
